name: KiJu Gastro Server-Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Server-Deployment ausdrücklich starten"
        required: true
        type: choice
        default: "Nicht deployen"
        options:
          - "Nicht deployen"
          - "Ja, jetzt deployen"

permissions:
  contents: read

concurrency:
  group: kiju-gastro-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'Ja, jetzt deployen'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Serverzugang sicher vorbereiten
        env:
          KIJU_DEPLOY_SSH_KEY: ${{ secrets.KIJU_DEPLOY_SSH_KEY }}
          KIJU_INTERNAL_ACCESS_CODE: ${{ secrets.KIJU_INTERNAL_ACCESS_CODE }}
          KIJU_SESSION_SECRET: ${{ secrets.KIJU_SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KIJU_DEPLOY_SSH_KEY}" ]]; then
            echo "GitHub-Secret KIJU_DEPLOY_SSH_KEY fehlt." >&2
            exit 1
          fi
          if [[ -z "${KIJU_INTERNAL_ACCESS_CODE}" ]]; then
            echo "GitHub-Secret KIJU_INTERNAL_ACCESS_CODE fehlt." >&2
            exit 1
          fi
          if [[ -z "${KIJU_SESSION_SECRET}" || ${#KIJU_SESSION_SECRET} -lt 32 ]]; then
            echo "GitHub-Secret KIJU_SESSION_SECRET fehlt oder ist zu kurz (mindestens 32 Zeichen)." >&2
            exit 1
          fi
          if [[ "${KIJU_INTERNAL_ACCESS_CODE}" == *$'\n'* || "${KIJU_INTERNAL_ACCESS_CODE}" == *$'\r'* || "${KIJU_SESSION_SECRET}" == *$'\n'* || "${KIJU_SESSION_SECRET}" == *$'\r'* ]]; then
            echo "Die VPS-Secrets dürfen keine Zeilenumbrüche enthalten." >&2
            exit 1
          fi

          install -m 700 -d "${HOME}/.ssh"
          key_file="${RUNNER_TEMP}/kiju-gastroweb-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/kiju-gastroweb-known-hosts"
          archive_file="${RUNNER_TEMP}/kiju-gastroweb-${GITHUB_SHA}.tar.gz"
          source_tar_file="${RUNNER_TEMP}/kiju-gastroweb-${GITHUB_SHA}.tar"
          secrets_stage_dir="${RUNNER_TEMP}/kiju-gastroweb-api-secrets"
          trap 'rm -f "${key_file}" "${known_hosts_file}" "${archive_file}" "${source_tar_file}"; rm -rf "${secrets_stage_dir}"' EXIT
          printf '%s\n' "${KIJU_DEPLOY_SSH_KEY}" > "${key_file}"
          unset KIJU_DEPLOY_SSH_KEY
          chmod 600 "${key_file}"
          printf '%s\n' '31.70.91.152 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIP7GFI/8WGI9bSwk44aGTMte/wKo3oAmZGVXKlh24QX' > "${known_hosts_file}"
          chmod 600 "${known_hosts_file}"

          umask 077
          install -d "${secrets_stage_dir}/.deploy"
          printf 'KIJU_INTERNAL_ACCESS_CODE=%s\nKIJU_SESSION_SECRET=%s\n' \
            "${KIJU_INTERNAL_ACCESS_CODE}" \
            "${KIJU_SESSION_SECRET}" > "${secrets_stage_dir}/.deploy/kiju-api-secrets.env"
          unset KIJU_INTERNAL_ACCESS_CODE KIJU_SESSION_SECRET

          git archive --format=tar "${GITHUB_SHA}" > "${source_tar_file}"
          tar --directory="${secrets_stage_dir}" --append --file="${source_tar_file}" .deploy/kiju-api-secrets.env
          gzip -1 < "${source_tar_file}" > "${archive_file}"
          test -s "${archive_file}"
          ssh -T \
            -i "${key_file}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${known_hosts_file}" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            root@31.70.91.152 "deploy ${GITHUB_SHA}" < "${archive_file}"
